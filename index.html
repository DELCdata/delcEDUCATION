<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://delcdata.github.io/DELCAppsHub/delc-kit.js?v=4"></script>
<script src="https://delcdata.github.io/DELCAppsHub/shared-auth.js?v=4"></script>
<title>delcEDUCATION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}
/* Layout: navy app bar + white working cards on a cool gray ground; Sunday-first (one room, one day) with records behind tabs */
:root{
  --navy:#1B3254; --navy-2:#26446f; --gold:#1B3254; --delc-green:#84c225; --gold-soft:#e6ecf5;
  --bg:#eef1f6; --card:#ffffff; --ink:#18233a; --muted:#5d6a82; --line:#dbe1ea; --soft:#f5f7fb;
  --ok:#1f7a4a; --ok-soft:#e3f4ea; --warn:#a15c00; --warn-soft:#fff2db; --bad:#b4232c; --bad-soft:#fde8ea; --info:#1f4f9c; --info-soft:#e6eefb;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#172133;--ink:#e6ebf4;--muted:#9aa7bd;--line:#2a3750;--soft:#1c2840;--gold-soft:#22314d;--ok:#5cc88d;--ok-soft:#173526;--warn:#f0b057;--warn-soft:#3a2b12;--bad:#ff7d86;--bad-soft:#3d1a1f;--info:#8db4ff;--info-soft:#1a2a47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#172133;--ink:#e6ebf4;--muted:#9aa7bd;--line:#2a3750;--soft:#1c2840;--gold-soft:#22314d;--ok:#5cc88d;--ok-soft:#173526;--warn:#f0b057;--warn-soft:#3a2b12;--bad:#ff7d86;--bad-soft:#3d1a1f;--info:#8db4ff;--info-soft:#1a2a47;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* app bar */
.bar{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--delc-green)}
.brand small{color:#b9c6dc;font-size:12.5px;white-space:nowrap}
.bar .sp{flex:1}
.who{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#c9d4e6;flex-wrap:wrap}
.who select{background:var(--navy-2);border:1px solid #3a5784;color:#fff;border-radius:999px;padding:5px 10px;font-size:13px}
.tabs{background:var(--navy);border-top:1px solid #2c4870}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:#c3cfe2;padding:10px 14px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:#fff}
.tabs button:focus-visible,.btn:focus-visible,.chipbtn:focus-visible{outline:2px solid #2F80ED;outline-offset:2px}
.demo{background:var(--gold-soft);color:var(--ink);font-size:12.5px;text-align:center;padding:6px 12px}
main{padding-block:18px 60px}
/* bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}.tiny{font-size:12.5px}.small{font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.gold{background:var(--gold-soft);color:var(--navy)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.inp,.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;font-weight:500;font-size:14.5px;color:var(--ink)}
.f textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-soft);color:var(--warn)}.notice.bad{background:var(--bad-soft);color:var(--bad)}.notice.ok{background:var(--ok-soft);color:var(--ok)}.notice.info{background:var(--info-soft);color:var(--info)}
/* day header */
.day{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.day h1{font-size:26px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.stepper button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:700}
.stepper span{padding:8px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chipbtn.on{border-color:var(--navy);background:var(--navy);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.alert{border-color:var(--warn);background:var(--warn-soft)}
.stat.alert b{color:var(--warn)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.today{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.today{grid-template-columns:1fr}}
/* roster */
.kid{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.kid:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);color:#fff;font-size:15px}
.kid .nm{font-weight:700}
.kid .nm button{all:unset;cursor:pointer}
.kid .nm button:hover{text-decoration:underline}
.kid.in{background:linear-gradient(90deg,var(--ok-soft),transparent 70%)}
.kid .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.allergy{background:var(--bad-soft);color:var(--bad);font-weight:800}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.sec h2{font-size:17px}
.plan{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.plan dt{font-weight:700;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:8px}
.plan dd{margin:2px 0 0}
.adult{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.adult:first-of-type{border-top:0}
.signin{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}.pwrow{display:flex;gap:6px;align-items:center}.pwrow input{flex:1;min-width:0}.modal .err{color:var(--bad);font-size:13px;font-weight:600;min-height:0}
.issue{border-left:4px solid var(--warn);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.issue.Injury{border-left-color:var(--bad)}.issue.Resolved{opacity:.75}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.hide-sm{display:none}}
/* profile */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.prof{grid-template-columns:1fr}}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phead .av{width:64px;height:64px;font-size:24px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:4px;background:var(--soft);border:1px solid var(--line);display:block}
.dots i.y{background:var(--ok);border-color:var(--ok)}
/* bars */
.barrow{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13.5px;margin-top:6px}
.track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
@media (max-width:640px){.barrow{grid-template-columns:100px minmax(0,1fr) 46px}}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,18,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.mbg{align-items:center;padding:20px}.modal{border-radius:18px}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.mhead h2{font-size:20px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.list-item{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
textarea.copy{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.kid{transition:background .25s}}

/* shared header buttons (2026-11-14) — same look in every delcAPP; delc-kit.js carries the full rule, this is the fallback */
.delc-hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;cursor:pointer}.delc-hbtn.pri{background:#fff;color:#1B3254}
header.bar .brand b{font-size:19px!important}@media(max-width:520px){header.bar .brand small{display:none}}

/* no gold (2026-11-14) */
@media (prefers-color-scheme:dark){.chip.gold{color:#c9d6ea}.btn.gold{background:#2c4f86;border-color:#2c4f86}}
body:has(.gate) header.bar,body:has(.gate) nav.tabs{display:none!important}
.delc-signin-card form .btn{width:100%;justify-content:center;text-align:center;padding:12px!important;font-size:15px!important}

/* one sign-in card in every delcAPP (2026-11-14) */
.delc-signin-card{max-width:400px!important;width:100%;border-radius:16px!important;padding:28px 26px!important;box-shadow:0 8px 30px rgba(27,50,84,.08)!important;text-align:left}
.delc-signin-top{text-align:center;margin-bottom:12px}
.delc-signin-top .delc-logo{display:block;width:220px;max-width:85%;height:auto;margin:0 auto 12px}
.delc-signin-top .wm,.delc-signin-top .delc-wm{font-size:20px!important;margin:0!important}
.delc-signin-top h1{font-family:var(--delc-display,inherit);font-size:26px!important;font-weight:800;margin:12px 0 4px!important;letter-spacing:-.01em;text-align:center}
.delc-signin-top .sub{font-size:13.5px;line-height:1.45;color:#5d6a82}
.delc-signin-top .sub b{display:block;font-weight:600;color:#33415a;margin-bottom:2px}
.delc-signin-links{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid #e3e8f0}
.delc-signin-links a,.delc-signin-links button{font:inherit;font-size:13px!important;font-weight:700;color:#1B3254;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:center}
.delc-signin-links .sec{font-weight:500;color:#5d6a82}
@media (prefers-color-scheme:dark){.delc-signin-top .delc-logo{background:#fff;border-radius:10px;padding:8px}.delc-signin-top .sub{color:#9aa7bd}.delc-signin-top .sub b{color:#c9d3e3}.delc-signin-links{border-top-color:#2a3750}.delc-signin-links a,.delc-signin-links button{color:#9fc0ea}.delc-signin-links .sec{color:#9aa7bd}}
.gate .wm{margin-bottom:0!important}
/* tab standard (reference app) */
.tabs button:hover{color:#fff!important;background:none!important}
</style>
</head>
<body>


<div class="demo">Demo with made-up children and adults. Changes are saved only in this browser. <button class="btn sm ghost" data-act="reset" style="padding:0 6px;text-decoration:underline">Reset demo</button></div>
<header class="bar"><div class="wrap">
  <div class="brand"><b>delc<span>EDUCATION</span></b><small>Kid's Korner &amp; Sunday School</small></div>
  <span class="sp"></span>
  <label class="who" for="as">Viewing as <select id="as" data-chg="as"></select></label>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="app"></main>
<div id="modal"></div>

<script>
/* ======== store ======== */
const KEY = 'delcedu_demo_v3';
/* Live hookup: set to {url, key} of the DELC Supabase project. Then the weekly-report kid counts load from att_days
   and the monthly summary is written to edu_summaries for delcBOARD. Left null, the app runs as a demo. */
let EDU_LIVE = null;
const TODAY = (() => { const d = new Date(); return iso(d); })();
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dOf(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = dOf(s); d.setDate(d.getDate() + n); return iso(d); }
function lastSunday(s) { const d = dOf(s); d.setDate(d.getDate() - d.getDay()); return iso(d); }
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = (s, o) => s ? dOf(s).toLocaleDateString('en-US', o || {month: 'short', day: 'numeric', year: 'numeric'}) : '';
const t12 = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
const nowT = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const ageOf = dob => { if (!dob) return ''; const b = dOf(dob), n = dOf(TODAY); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function seed() {
  const rooms = [
    {id: 'kk', name: "Kid's Korner", ages: 'Ages 3–5', color: '#B83280', place: 'Kids Korner - Nursery/Pre-K'},
    {id: 'cc', name: "Children's Room", ages: 'K – 2nd grade', color: '#2F80ED', place: 'Kids Korner - Elementary'},
    {id: 'ss', name: 'Sunday School', ages: '3rd – 6th grade', color: '#1a6e3c', place: 'Kids Korner - Elementary'},
    {id: 'yg', name: 'Youth Group', ages: '7th – 12th grade', color: '#7e3a8a', place: 'Kids Korner - Youth'},
    {id: 'jam', name: 'JAM', ages: 'K – 6th grade', color: '#d9534f', place: 'JAM Room', meets: {mode: 'nth', day: 3, weeks: [2, 4], time: '6:30 PM', dates: []}}
  ];
  const by = (y, m, d) => iso(new Date(y, m - 1, d));
  const K = (first, last, dob, room, gName, gPhone, extra) => ({id: 'k' + uid(), first, last, dob, room_id: room, grade: '', guardians: [{name: gName, rel: 'Parent', phone: gPhone, email: ''}], pickups: [{name: gName, rel: 'Parent', phone: gPhone}], allergies: '', medical: '', photo_ok: true, notes: '', active: true, visitor: false, joined: '2025-09-07', ...(extra || {})});
  const students = [
    K('Avery', 'Sample', by(2021, 4, 12), 'kk', 'Jordan Sample', '814-555-0101', {allergies: 'Peanuts — EpiPen in office', pickups: [{name: 'Jordan Sample', rel: 'Parent', phone: '814-555-0101'}, {name: 'Pat Sample', rel: 'Grandparent', phone: '814-555-0102'}]}),
    K('Milo', 'Example', by(2022, 1, 30), 'kk', 'Casey Example', '814-555-0103'),
    K('Nora', 'Placeholder', by(2021, 9, 3), 'kk', 'Riley Placeholder', '814-555-0104', {photo_ok: false}),
    K('Theo', 'Demo', by(2020, 11, 21), 'kk', 'Morgan Demo', '814-555-0105'),
    K('Ivy', 'Testwell', by(2022, 6, 14), 'kk', 'Drew Testwell', '814-555-0106', {medical: 'Asthma — inhaler in bag'}),
    K('Leo', 'Sampleton', by(2019, 2, 8), 'cc', 'Sam Sampleton', '814-555-0107'),
    K('Ruby', 'Fakename', by(2018, 7, 19), 'cc', 'Alex Fakename', '814-555-0108', {allergies: 'Dairy'}),
    K('Owen', 'Mockley', by(2019, 10, 1), 'cc', 'Jamie Mockley', '814-555-0109'),
    K('Hazel', 'Examplar', by(2018, 3, 27), 'cc', 'Taylor Examplar', '814-555-0110'),
    K('Finn', 'Notreal', by(2019, 5, 5), 'cc', 'Quinn Notreal', '814-555-0111'),
    K('Clara', 'Pretend', by(2018, 12, 12), 'cc', 'Rowan Pretend', '814-555-0112'),
    K('Eli', 'Specimen', by(2016, 8, 22), 'ss', 'Blake Specimen', '814-555-0113'),
    K('Maya', 'Template', by(2015, 4, 2), 'ss', 'Cameron Template', '814-555-0114', {allergies: 'Bee stings'}),
    K('Jack', 'Standin', by(2016, 1, 17), 'ss', 'Devon Standin', '814-555-0115'),
    K('Lucy', 'Dummy', by(2014, 11, 9), 'ss', 'Emerson Dummy', '814-555-0116'),
    K('Sam', 'Fictional', by(2015, 6, 30), 'ss', 'Finley Fictional', '814-555-0117'),

/* ======== Supply requests (Derek, 2026-11-09): teachers ask for supplies → Erin (the Director) gets an email; she marks it ordered / ready / done and can email the teacher back ======== */
const SUP_STATUS = {Requested: 'warn', Ordered: 'info', 'Ready to pick up': 'gold', Done: 'ok', Declined: ''};

    ${s.needed_by ? `<div class="tiny">Needed by <b>${fmt(s.needed_by, {weekday: 'short', month: 'short', day: 'numeric'})}</b></div>` : ''}${s.note ? `<div class="small" style="margin-top:4px">${esc(s.note)}</div>` : ''}

function viewSupplies() {
  const dir = isDirector(); const f = S.supF || 'open'; const L = mySups().filter(s => f === 'all' || supOpen(s)).sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || String(b.created_at).localeCompare(String(a.created_at)));

    <div class="notice info" style="margin-bottom:12px">${dir ? 'Teachers’ supply requests land here and in your email. Mark each one Ordered, Ready to pick up or Done — you can email the teacher an update.' : 'Need crayons, glue sticks or something for a lesson? Ask here — the Christian Ed Director gets an email right away and you’ll see when it’s ordered or ready.'}</div>
    <div class="rooms" style="margin-bottom:12px">${[['open', 'Open'], ['all', 'All']].map(([k, l]) => `<button class="chipbtn ${f === k ? 'on' : ''}" data-act="supF" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="stack">${L.map(supCard).join('') || `<div class="card empty">${f === 'open' ? 'No open supply requests.' : 'No supply requests yet.'}</div>`}</div>`;
}
function supModal(s) {
  const isNew = !s; const R = isDirector() ? DB.rooms : myRooms(); const me = meAdult() || {};
  const x = s ? JSON.parse(JSON.stringify(s)) : {id: 'sup' + uid(), created_at: new Date().toISOString(), by: me.name || (Live.sess && (Live.sess.displayName || Live.sess.username)) || 'Director', by_id: me.id || '', room_id: (R.find(r => r.id === S.room) || R[0] || {}).id || '', items: [{item: '', qty: '1', note: ''}], needed_by: '', urgent: false, note: '', status: 'Requested'};
  S.modal = {sup: x, focus: true, html: () => { const y = S.modal.sup; return `${head(isNew ? 'Request supplies' : 'Edit supply request')}<div class="stack">
    <label class="f" for="sp_r">For which class<select id="sp_r">${R.map(r => `<option value="${r.id}" ${r.id === y.room_id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>
    <div class="f"><span>What do you need?</span>${y.items.map((it, i) => `<div class="suprow"><input data-sp="${i}" data-k="item" value="${esc(it.item)}" placeholder="Item (e.g. glue sticks)"><input data-sp="${i}" data-k="qty" value="${esc(it.qty)}" placeholder="How many" inputmode="numeric"><input data-sp="${i}" data-k="note" value="${esc(it.note)}" placeholder="Brand, color or a link (optional)" class="wide"><button class="btn sm ghost" data-act="supRowDel" data-i="${i}" aria-label="Remove item" ${y.items.length < 2 ? 'disabled' : ''}>✕</button></div>`).join('')}<button class="btn sm" data-act="supRowAdd" style="align-self:flex-start">+ Add another item</button></div>
    <div class="grid2"><label class="f" for="sp_d">Needed by (optional)<input id="sp_d" type="date" value="${esc(y.needed_by)}"></label><label class="row small" style="font-weight:600;align-self:end;gap:8px"><input type="checkbox" id="sp_u" ${y.urgent ? 'checked' : ''} style="width:18px;height:18px"> This is urgent</label></div>
    <label class="f" for="sp_n">Anything else? (optional)<textarea id="sp_n" rows="2" placeholder="e.g. for the Advent craft on Dec 7">${esc(y.note)}</textarea></label>
    ${isNew ? '<div class="tiny muted">Sending this emails the Christian Ed Director.</div>' : ''}</div>${foot(isNew ? 'Send request' : 'Save', !isNew ? '<button class="btn danger" data-act="supDel">Delete</button>' : '')}`; },
    onSave: () => { supGrab(); const y = S.modal.sup; y.items = y.items.filter(i => i.item); if (!y.items.length) { toast('Add at least one item'); return false; } if (!y.room_id) { toast('Pick a class'); return false; }
      const i = sups().findIndex(q => q.id === y.id); if (i >= 0) sups()[i] = y; else sups().push(y);
      if (isNew) setTimeout(() => supSend(y.id), 50); else toast('Saved'); return true; }};
  renderModal();
}
function supGrab() { const y = S.modal && S.modal.sup; if (!y) return; $$('#modal [data-sp]').forEach(el => { const it = y.items[+el.dataset.sp]; if (it) it[el.dataset.k] = el.value.trim(); }); if ($('#sp_r')) y.room_id = val('sp_r'); if ($('#sp_d')) y.needed_by = val('sp_d'); if ($('#sp_u')) y.urgent = $('#sp_u').checked; if ($('#sp_n')) y.note = val('sp_n'); }
async function supSend(id) {
  if (!(typeof Live !== 'undefined' && Live.on)) { toast('Request saved — in the live app this emails the Christian Ed Director'); return; }
  toast('Sending to the director…'); try { await Live.flush(); } catch (_) {}
  const r = await eduFn({mode: 'supply', id});
  if (r.ok) { const s = sups().find(x => x.id === id); if (s) s.emailed_at = new Date().toISOString(); render(); toast('Sent — the director has been emailed'); }
  else toast('Saved, but the email didn’t go out' + (r.error ? ' (' + r.error + ')' : '') + '. The director will still see it in the app.');
}
function supUpdateModal(s) { const x = JSON.parse(JSON.stringify(s)); const t = adult(s.by_id);
  openModal(() => `${head('Update supply request')}<div class="stack">${supCard(x).replace(/<div class="row" style="gap:6px;margin-top:8px[\s\S]*$/, '</div>')}
    <div class="f"><span>Status</span><div class="rooms">${Object.keys(SUP_STATUS).map(k => `<label class="chipbtn" style="font-weight:600"><input type="radio" name="su_s" value="${k}" ${k === x.status ? 'checked' : ''} style="width:16px;height:16px"> ${k}</label>`).join('')}</div></div>
    <label class="f" for="su_r">Note to ${esc((s.by || 'the teacher').split(' ')[0])} (optional)<textarea id="su_r" rows="2" placeholder="e.g. Ordered from Amazon — should be in the office by Friday">${esc(x.reply || '')}</textarea></label>
    <label class="row small" style="font-weight:600;gap:8px"><input type="checkbox" id="su_e" checked style="width:18px;height:18px"> Email ${esc((s.by || 'the teacher').split(' ')[0])} about this update${t && !t.email && !t.hub ? ' <span class="tiny muted">(no email on file)</span>' : ''}</label></div>${foot('Save update')}`, () => {
    const st = ($('input[name="su_s"]:checked') || {}).value || x.status; const reply = val('su_r'); const email = $('#su_e').checked;
    const i = sups().findIndex(q => q.id === s.id); if (i < 0) return true;
    const y = {...sups()[i], status: st, reply, reply_by: (meAdult() || {}).name || 'Christian Ed Director', updated: new Date().toISOString()}; sups()[i] = y;
    if (email) setTimeout(async () => { if (!(typeof Live !== 'undefined' && Live.on)) { toast('Saved — in the live app the teacher gets an email'); return; } try { await Live.flush(); } catch (_) {} const r = await eduFn({mode: 'supply_update', id: y.id, sent_by: y.reply_by}); toast(r.ok ? 'Saved and emailed ' + (y.by || 'the teacher') : 'Saved, but the email didn’t go out' + (r.error ? ' (' + r.error + ')' : '')); }, 50); else toast('Saved');
    return true; }); }
Object.assign(A, {
  supF: d => { S.supF = d.v; render(); },
  supNew: () => supModal(null),
  supEdit: d => { const s = sups().find(x => x.id === d.id); if (s) supModal(s); },
  supUpdate: d => { const s = sups().find(x => x.id === d.id); if (s) supUpdateModal(s); },
  supRowAdd: () => { supGrab(); S.modal.sup.items.push({item: '', qty: '1', note: ''}); S.modal.focus = false; renderModal(); const L = $$('#modal [data-k="item"]'); if (L.length) L[L.length - 1].focus(); },
  supRowDel: d => { supGrab(); S.modal.sup.items.splice(+d.i, 1); S.modal.focus = false; renderModal(); },
  supDel: () => { const y = S.modal.sup; if (!confirm('Delete this supply request?')) return; DB.supplies = sups().filter(x => x.id !== y.id); persist(); closeModal(); render(); toast('Deleted'); }
});
/* tab + routing */
const _renderTabsS = renderTabs;
renderTabs = function () { const keepTab = S.tab; if (keepTab === 'supplies') S.tab = 'today'; _renderTabsS(); S.tab = keepTab; const t = $('#tabs'); if (!t || t.querySelector('[data-v="supplies"]')) return; const n = isDirector() ? sups().filter(s => s.status === 'Requested').length : 0;
  const btn = `<button class="${S.tab === 'supplies' ? 'on' : ''}" data-act="tab" data-v="supplies">Supplies${n ? ` <span class="chip warn" style="margin-left:4px">${n}</span>` : ''}</button>`;

  if (S.tab === 'supplies') t.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === 'supplies')); };
const _renderS = render;
render = function () { if (S.tab !== 'supplies' || S.student) return _renderS(); const keep = S.tab; S.tab = 'today'; _renderS(); S.tab = keep; $('#tabs').innerHTML = ''; renderTabs(); $('#app').innerHTML = viewSupplies(); saveUi(); renderModal(); };
const _viewDashS = viewDash;

  return h.replace('<div class="stats">', `<div class="notice info" style="margin-bottom:12px">📦 <div><b>${plural(L.length, 'supply request')} waiting:</b> ${L.slice(0, 5).map(s => `${esc(s.by || '')} (${esc(room(s.room_id).name)}${s.urgent ? ', urgent' : ''})`).join(', ')} <button class="btn sm" data-act="tab" data-v="supplies" style="margin-left:6px">Open Supplies</button></div></div><div class="stats">`); };

/* ---- Adults are people in delcPEOPLE (2026-11-14): the name box suggests everyone there; picking a name fills phone, email, sign-in and clearance dates. The database link (edu_adult_sync) does the rest. ---- */
let PPL = null;
async function pplLoad() {
  if (PPL || typeof Live === 'undefined' || !Live.on || !window.DelcAuth) return PPL || [];
  try {
    const sel = 'id,first:data->>first,last:data->>last,phone:data->>phone,email:data->>email,hub:data->>hub,active:data->>active,ca:data->clearances->>child_abuse,tx:data->>training_exp,edu:data->>edu_adult';
    const r = await fetch(`${DelcAuth.SUPABASE_URL}/rest/v1/people_records?kind=eq.people&select=${sel}`, {headers: hubHdr()});
    if (!r.ok) throw new Error('people ' + r.status);
    PPL = (await r.json()).filter(p => p.active !== 'false').map(p => ({...p, name: [p.first, p.last].filter(Boolean).join(' ').trim()})).filter(p => p.name).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { console.warn('delcPEOPLE list', e); PPL = []; }
  return PPL;
}
const pplNorm = v => String(v || '').toLowerCase().replace(/\s+/g, ' ').trim();
const _adultModalP = adultModal;
adultModal = function (a) {
  const isNew = !a; _adultModalP(a);
  pplLoad().then(L => {
    const n = $('#a_n'); if (!n || !L.length) return;
    let dl = document.getElementById('pplNames'); if (!dl) { dl = document.createElement('datalist'); dl.id = 'pplNames'; document.body.appendChild(dl); }
    const taken = new Set(DB.adults.filter(x => !a || x.id !== a.id).map(x => pplNorm(x.name)));
    dl.innerHTML = L.filter(p => !taken.has(pplNorm(p.name))).map(p => `<option value="${esc(p.name)}"></option>`).join('');
    n.setAttribute('list', 'pplNames'); n.setAttribute('autocomplete', 'off');
    let hint = document.getElementById('a_pplhint'); if (!hint) { hint = document.createElement('div'); hint.id = 'a_pplhint'; hint.className = 'tiny muted'; n.closest('.grid2').insertAdjacentElement('afterend', hint); }
    const fill = (p, force) => { const set = (id, v) => { const el = $('#' + id); if (el && v && (force || !el.value)) el.value = v; };
      set('a_p', p.phone); set('a_e', p.email); set('a_hub', p.hub); set('a_c1', p.ca); set('a_tx', p.tx); };
    const check = (ev) => { const p = L.find(x => pplNorm(x.name) === pplNorm(n.value));
      if (p) { hint.innerHTML = `✓ <b>${esc(p.name)}</b> is in delcPEOPLE${isNew ? ' — phone, email, sign-in and clearance dates filled in where blank' : ''}.`; if (isNew && ev) fill(p, false); }
      else hint.textContent = n.value.trim() ? 'Not in delcPEOPLE yet — they’re added there when you save.' : (isNew ? 'Start typing to pick someone from delcPEOPLE.' : ''); };
    n.addEventListener('input', check); n.addEventListener('change', check); check(null);
  });
};
