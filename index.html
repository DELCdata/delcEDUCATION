.page{max-width:1240px;margin:0 auto;padding:18px}

.depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:110px}
.att{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:14px;align-items:center}
.att .pa{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.att .pa button.on.p{background:var(--okbg);color:var(--ok)}.att .pa button.on.a{background:var(--badbg);color:var(--bad)}

.doc a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{border:0;background:none;color:#b0b5bf;font-size:14px;padding:2px 6px}
.rm:hover{color:var(--bad)}
.notice{background:var(--warnbg);color:#6b4500;border-radius:12px;padding:10px 12px;font-size:13px}
.notice.info{background:var(--infobg);color:#1f3f86}

.pcard{cursor:pointer;transition:box-shadow .15s}.pcard:hover{box-shadow:0 4px 16px rgba(27,50,84,.12)}
.bar{height:7px;background:#eceef2;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok,#1a6e3c);border-radius:6px}.bar.over i{background:var(--bad)}
.box{border:1px solid #e7e3da;border-radius:12px;padding:10px 12px;background:#fcfbf8}
.ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f1efe9;font-size:14px}.ck>span{flex:1;min-width:0}.ck.done>span{text-decoration:line-through;opacity:.6}.ck input{margin-top:3px}
.logline{font-size:13px;padding:6px 0;border-bottom:1px solid #f1efe9}

.calday{width:42px;text-align:center;flex-shrink:0;line-height:1.1}.calday span{display:block;font-size:11px;color:var(--muted,#667085);text-transform:uppercase}.calday b{font-size:19px;color:var(--navy)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:8px}

.pcover{margin:-16px -16px 10px;height:130px;overflow:hidden;border-radius:12px 12px 0 0;background:#e9eaee}.pcover img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowIso = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dOf = iso => { const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = (iso, o) => iso ? dOf(iso).toLocaleDateString([], o || {month:'long', day:'numeric', year:'numeric'}) : '';
const fmtDT = iso => iso ? new Date(iso).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
const monLabel = iso => iso ? dOf(iso).toLocaleDateString('en-US', {month:'short', year:'numeric'}).toUpperCase() : '';

const nowTime = () => new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
function toast(msg, kind='') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;

}
const body = id => S.bodies.find(b => b.id === id);

const mtg = id => S.meetings.find(m => m.id === id);

async function save(kind, row) {
  row.updated_at = nowIso(); if (!row.created_at) row.created_at = row.updated_at;
  const a = S[kind]; const i = a.findIndex(r => r.id === row.id); if (i >= 0) a[i] = row; else a.push(row);
  S.saving++; renderSaving();
  try { const saved = await B.upsert(kind, row); const j = a.findIndex(r => r.id === row.id); if (saved && j >= 0) a[j] = {...saved}; return saved || row; }
  catch (e) { console.error(e); toast('Could not save: ' + (e.message || e), 'bad'); throw e; }
  finally { S.saving--; renderSaving(); }
}
async function del(kind, id) {
  const a = S[kind]; const i = a.findIndex(r => r.id === id); if (i >= 0) a.splice(i, 1);
  try { await B.remove(kind, id); } catch (e) { toast('Could not delete: ' + (e.message || e), 'bad'); }
}

/* ---------------- meeting logic ---------------- */
async function createMeeting(o) {
  const b = body(o.body_id);
  const m = {id: uid(), body_id: o.body_id, title: o.title || `${b.name} — ${monthName(o.date)}`, meeting_date: o.date, start_time: o.time || '', location: o.location || '',
    status: 'draft', attendance: {present: [], absent: []}, opening: b.kind === 'council' ? 'Pastor led prayer.' : '', links: [], published: false, confidential: b.kind === 'executive'};
  await save('meetings', m);
  const its = []; const mots = []; const placed = [];
  const add = (section, extra) => { const it = {id: uid(), meeting_id: m.id, section, sort: (its.filter(x => x.section === section).length + 1) * 10, updates: [], ...extra}; its.push(it); return it; };
  add('opening', {title: b.kind === 'council' ? 'Call to order & opening prayer' : 'Call to order'});
  const prev = prevMeeting(m);
  if (prev && prev.status !== 'approved' && prev.status !== 'cancelled') {
    const it = add('minutes', {title: `${monthName(prev.meeting_date)} meeting minutes`, body: 'Approval needed — view minutes attached.'});
    mots.push({id: uid(), meeting_id: m.id, item_id: it.id, sort: 0, text: `Approve the ${monthName(prev.meeting_date)} meeting minutes`, result: 'pending', approves_meeting_id: prev.id});
  }
  const ths = S.threads.filter(t => t.body_id === o.body_id && t.status === 'open').sort((a, c) => (a.sort || 0) - (c.sort || 0));
  ths.forEach(t => add('old', {title: t.title, thread_id: t.id}));
  if (b.kind === 'council') {
    add('financial', {title: 'Financial update'});
    S.departments.filter(d => d.active !== false).sort((a, c) => (a.sort || 0) - (c.sort || 0)).forEach(d => { const it = add('dept', {title: d.name, department_id: d.id, presenter: d.leader || ''}); waitingUpdates(d.id).forEach(u => { it.updates.push(...updLines(u)); placed.push({u, it}); }); });
  }
  if (o.inbox) for (const x of S.inbox.filter(x => x.status === 'pending' && (!x.body_id || x.body_id === o.body_id))) {
    const it = add(x.section === 'old' || x.section === 'financial' ? x.section : 'new', {title: x.title, body: x.summary || '', source: x.source, source_id: x.source_id, source_link: x.link});
    await save('inbox', {...clone(x), status: 'accepted', meeting_id: m.id, item_id: it.id});
  }
  const close = add('closing', {title: 'Adjourn'});
  mots.push({id: uid(), meeting_id: m.id, item_id: close.id, sort: 0, text: 'Adjourn', result: 'pending'});
  for (const it of its) await save('items', it);
  for (const mo of mots) await save('motions', mo);
  for (const {u, it} of placed) await save('updates', {...clone(u), meeting_id: m.id, item_id: it.id, updated_at: nowIso()});
  return m;
}
async function syncThreadLog(it) {
  const t = thr(it.thread_id); const m = mtg(it.meeting_id); if (!t || !m) return;
  const text = (it.minutes || '').trim();
  const log = (t.log || []).filter(e => e.meeting_id !== m.id);
  if (text) {
    const entry = {label: monLabel(m.meeting_date), text, meeting_id: m.id, ...(it.confidential ? {confidential: true} : {})};
    const at = log.findIndex(e => e.meeting_id && mtg(e.meeting_id) && String(mtg(e.meeting_id).meeting_date) > String(m.meeting_date));
    if (at >= 0) log.splice(at, 0, entry); else log.push(entry);
  }
  await save('threads', {...clone(t), log});
}
async function applyMotionEffects(mo, prevResult) {
  if (!mo.approves_meeting_id) return;
  const target = mtg(mo.approves_meeting_id); if (!target) return;
  const m = mtg(mo.meeting_id); const b = body(target.body_id) || {};
  if (mo.result === 'approved' && target.status !== 'approved') {
    await save('meetings', {...clone(target), status: 'approved', approved_at: nowIso(), approved_in: m.id, published: target.imported ? !!target.published : (b.public_minutes !== false && !target.confidential)});

    await save('meetings', {...clone(target), status: 'minutes_draft', approved_at: null, approved_in: null});
  }
}

function fmtUpd(t) { const s = String(t || ''); const lvl = Math.min(3, (s.match(/^\t*/)[0] || '').length); const body = s.replace(/^\t+/, ''); const num = false;

function nextMeetingDate(bid) {
  const last = meetingsOf(bid)[0]; const d = new Date(); d.setDate(d.getDate() + 1);
  if (bid === 'council') { // 2nd Sunday of next month after the last meeting
    const base = last ? dOf(last.meeting_date) : new Date(); const n = new Date(base.getFullYear(), base.getMonth() + 1, 1);
    while (n.getDay() !== 0) n.setDate(n.getDate() + 1); n.setDate(n.getDate() + 7); if (n < new Date()) return today(); return isoOf(n);
  }
  return isoOf(d);
}

    <div><div class="sectitle">Groups</div><div class="rcpt">${S.bodies.map(b => `<label><input type="checkbox" class="mm_b" value="${b.id}" ${(x.body_ids || []).includes(b.id) ? 'checked' : ''}> ${esc(b.name)}</label>`).join('')}</div></div>

  return `<div class="mhead"><h2>${t.id && thr(t.id) ? 'Edit ongoing item' : 'New ongoing item'}</h2><button class="x" data-act="closeModal">×</button></div><div class="stack">
    <label class="f">Title<input id="mt_title" value="${esc(t.title || '')}" placeholder="e.g. Parking lot resurfacing"></label>
    <div class="grid2"><label class="f">Group under (optional)<input id="mt_grp" list="grps" value="${esc(t.grp || '')}" placeholder="Facilities Projects"><datalist id="grps">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist></label>
      <label class="f">Approval note<input id="mt_appr" value="${esc(t.approval || '')}" placeholder="Approved: Unanimous"></label></div>
    <label class="f">Meeting group<select id="mt_body">${S.bodies.map(b => `<option value="${b.id}" ${b.id === bid ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select></label>
    <label class="f">History — one entry per line, like "SEP 2026 – Bid received $5,000"<textarea id="mt_log" rows="6">${esc((t.log || []).map(e => e.label + ' – ' + e.text).join('\n'))}</textarea></label>
    <div class="row" style="justify-content:space-between">${t.id && thr(t.id) ? '<button class="btn bad sm" data-act="delThread">Delete</button>' : '<span></span>'}<button class="btn pri" data-act="saveThread">Save</button></div></div>`;
}
function mInboxAdd(x) {
  const ups = S.meetings.filter(m => isUpcoming(m) && (!x.body_id || m.body_id === x.body_id)).sort((a, b) => String(a.meeting_date).localeCompare(String(b.meeting_date)));
  return `<div class="mhead"><h2>Add to an agenda</h2><button class="x" data-act="closeModal">×</button></div><div class="stack">
    <div><b>${esc(x.title)}</b><div class="small muted" style="white-space:pre-wrap">${esc(x.summary || '')}</div></div>
    <label class="f">Meeting<select id="ia_mtg">${ups.map(m => `<option value="${m.id}" ${S.modal.mid === m.id ? 'selected' : ''}>${esc(m.title)} — ${esc(fmtD(m.meeting_date))}</option>`).join('')}</select></label>
    ${ups.length ? '' : '<div class="notice">No upcoming meeting yet — create one first (it can pull in Inbox items automatically).</div>'}
    <label class="f">Section<select id="ia_sec">${['new','old','financial','dept','other'].map(s => `<option value="${s}" ${(x.section || 'new') === s ? 'selected' : ''}>${SECNAME[s]}</option>`).join('')}</select></label>
    <label class="chk"><input type="checkbox" id="ia_thread"> Also track it as an ongoing item (shows on every agenda until completed)</label>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="inboxConfirm" ${ups.length ? '' : 'disabled'}>Add</button></div></div>`;
}
function mItemMenu(it) {
  const m = mtg(it.meeting_id);
  return `<div class="mhead"><h2>${esc(it.title || 'Item')}</h2><button class="x" data-act="closeModal">×</button></div><div class="stack">
    <div class="grid2"><label class="f">Section<select id="im_sec">${SECTIONS.filter(([s]) => !['opening','closing'].includes(s)).map(([s, n]) => `<option value="${s}" ${it.section === s ? 'selected' : ''}>${n}</option>`).join('')}</select></label><label class="f">Presenter<input id="im_pres" value="${esc(it.presenter || '')}"></label></div>
    <label class="chk"><input type="checkbox" id="im_conf" ${it.confidential ? 'checked' : ''}> Confidential — keep this item off the minutes, the public page and emails</label>
    ${!it.thread_id ? `<label class="chk"><input type="checkbox" id="im_thread"> Track as an ongoing item on future agendas</label>` : ''}
    <div class="row" style="justify-content:space-between"><button class="btn bad sm" data-act="delItem">Remove from agenda</button><button class="btn pri" data-act="saveItemMenu">Save</button></div></div>`;
}
function renderModal() {
  const md = S.modal; const box = $('#modal');
  if (!md) { box.innerHTML = ''; document.body.style.overflow = ''; return; }
  const inner = md.type === 'newMeeting' ? mNewMeeting() : md.type === 'editMeeting' ? mEditMeeting(mtg(S.meetingId)) : md.type === 'packet' ? mPacket(mtg(S.meetingId))
    : md.type === 'member' ? mMember(md.row) : md.type === 'body' ? mBody(md.row) : md.type === 'dept' ? mDept(md.row) : md.type === 'thread' ? mThread(md.row)
    : md.type === 'inboxAdd' ? mInboxAdd(S.inbox.find(x => x.id === md.id)) : md.type === 'itemMenu' ? mItemMenu(item(md.id)) : '';
  box.innerHTML = `<div class="modal-bg" data-act="bgClose"><div class="modal" role="dialog">${inner}</div></div>`; document.body.style.overflow = 'hidden';
  if (md.type === 'packet' && md.kind) $$('[data-act=packetKind]').forEach(b => b.classList.toggle('on', b.dataset.v === md.kind));
}

/* ---------------- render ---------------- */
function renderApp() {
  const app = $('#app');
  if (PUBLIC === 'public') { app.innerHTML = viewPublic(); return; }
  if (PUBLIC === 'update') { app.innerHTML = viewUpdateForm(); return; }
  if (!S.user) { app.innerHTML = viewLogin(); return; }
  const qFocus = document.activeElement && document.activeElement.dataset.inp === 'q' ? document.activeElement.selectionStart : null;
  const y = window.scrollY;
  const v = S.view; const bodyHtml = !S.loaded ? '<div class="page empty">Loading…</div>' : role() === 'none' ? viewNoAccess() : role() === 'director' ? viewDepts() : S.meetingId ? viewMeeting() : v === 'depts' ? viewDepts() : v === 'inbox' ? viewInbox() : v === 'ongoing' ? viewOngoing() : v === 'actions' ? viewActions() : v === 'records' ? viewRecords() : v === 'settings' ? viewSettings() : viewMeetings();
  app.innerHTML = header() + bodyHtml; renderSaving();
  if (qFocus != null) { const el = $('[data-inp="q"]'); if (el) { el.focus(); try { el.setSelectionRange(qFocus, qFocus); } catch (_) {} } }
  if (S.keepScroll) { window.scrollTo(0, y); S.keepScroll = false; }
}
function rerender() { S.keepScroll = true; renderApp(); }

/* ---------------- email ---------------- */
async function checkEmail() { if (S.backend === 'local') { S.emailCfg = null; return; } const r = await B.fn({mode:'status'}); S.emailCfg = r && r.ok && r.provider ? {from: r.from} : null; }

/* ---------------- actions ---------------- */
const ACT = {
  async login() {
    const u = ($('#lu').value || '').trim().toLowerCase(); const pw = $('#lp').value; const err = m => { $('#lerr').textContent = m; };
    if (!u || !pw) { err('Enter your username and password.'); return; }
    if (!window.supabase) { err('Could not reach the database library.'); return; }
    let session = null;
    if (window.DelcAuth) {
      err('Signing in…'); let res; try { res = await DelcAuth.login(u, pw); } catch (e) { res = {ok:false, error:'Could not reach the login service.'}; }
      if (!res || !res.ok) { err((res && res.error) || 'That username or password isn’t right.'); return; }
      session = res.session || DelcAuth.getSession();
      if (!DelcAuth.hasAppAccess(session, CONFIG.appKey)) { err('Your account doesn’t have access to delcBOARD yet. Ask an admin to turn it on in the Admin Portal.'); return; }
    } else if (pw !== CONFIG.password) { err('The login service is unreachable and that isn’t the fallback password.'); return; }
    signIn(session, u); boot();
  },
  demo() { S.user = 'demo'; S.userName = 'Demo'; S.backend = 'local'; lsSet('board_user', 'demo'); lsSet('board_backend', 'local'); boot(); },
  logout() { if (!confirm('Sign out? This also signs you out of the DELC Apps Hub on this device.')) return; B.unsubscribe(); S.user = null; localStorage.removeItem('board_user'); lsSet('board_backend', 'remote'); if (window.DelcAuth && S.backend !== 'local') { try { DelcAuth.clearSession(); } catch (_) {} } renderApp(); },
  tab(d, e) { if (e) e.preventDefault(); S.view = d.v; S.meetingId = null; S.deptId = null; S.q = ''; renderApp(); scrollTo(0, 0); if (d.v === 'settings') checkEmail().then(renderApp); },
  back(d, e) { e.preventDefault(); S.meetingId = null; renderApp(); },
  bodyF(d) { S.bodyF = d.v; renderApp(); },
  actF(d) { S.actF = d.v; renderApp(); },
  toggleShowClosed() { S.showClosed = !S.showClosed; renderApp(); },
  closeModal() { S.modal = null; renderModal(); },
  bgClose(d, e) { if (e.target.classList.contains('modal-bg')) { S.modal = null; renderModal(); } },
  copy(d) { (navigator.clipboard ? navigator.clipboard.writeText(d.v) : Promise.reject()).then(() => toast('Copied', 'ok')).catch(() => toast(d.v)); },
  openMeeting(d, e) { if (e) e.preventDefault(); const m = mtg(d.id); if (!m) return; S.meetingId = d.id; S.mode = m.imported || m.status === 'approved' ? 'doc-minutes' : m.status === 'in_progress' ? 'live' : m.status === 'minutes_draft' ? 'doc-minutes' : 'agenda'; renderApp(); scrollTo(0, 0); },
  mode(d) { S.mode = d.v; rerender(); },
  newMeeting() { S.modalBody = null; S.modal = {type:'newMeeting'}; renderModal(); },
  async createMeeting() {
    const o = {body_id: $('#nm_body').value, date: $('#nm_date').value, time: $('#nm_time').value.trim(), location: $('#nm_loc').value.trim(), title: $('#nm_title').value.trim(), inbox: $('#nm_inbox') ? $('#nm_inbox').checked : false};
    if (!o.date) { toast('Pick a date', 'bad'); return; }
    const btn = $('[data-act=createMeeting]'); btn.disabled = true; btn.textContent = 'Building agenda…';
    try { const m = await createMeeting(o); S.modal = null; renderModal(); S.meetingId = m.id; S.mode = 'agenda'; renderApp(); scrollTo(0, 0); toast('Agenda created — fill in this month’s updates', 'ok'); }
    catch (e) { btn.disabled = false; btn.textContent = 'Create agenda'; }
  },
  editMeeting() { S.modal = {type:'editMeeting'}; renderModal(); },
  async saveMeeting() {
    const m = mtg(S.meetingId);
    await save('meetings', {...clone(m), title: $('#em_title').value.trim() || m.title, meeting_date: $('#em_date').value || m.meeting_date, start_time: $('#em_start').value.trim(), end_time: $('#em_end').value.trim(), location: $('#em_loc').value.trim(), status: $('#em_status').value, published: $('#em_pub').checked, confidential: $('#em_conf').checked});
    S.modal = null; renderModal(); rerender(); toast('Saved', 'ok');
  },
  async deleteMeeting() {
    const m = mtg(S.meetingId); if (prompt(`Type DELETE to permanently delete “${m.title}” with all its items, motions and documents.`) !== 'DELETE') return;
    for (const d of docsOf(m.id)) { await B.unupload(d.path); await del('docs', d.id); }
    for (const a of S.actions.filter(a => a.meeting_id === m.id)) await del('actions', a.id);
    for (const x of S.inbox.filter(x => x.meeting_id === m.id)) await save('inbox', {...clone(x), status: 'pending', meeting_id: null, item_id: null});
    for (const t of S.threads) if ((t.log || []).some(e => e.meeting_id === m.id)) await save('threads', {...clone(t), log: t.log.filter(e => e.meeting_id !== m.id)});
    await del('meetings', m.id); S.items = S.items.filter(i => i.meeting_id !== m.id); S.motions = S.motions.filter(x => x.meeting_id !== m.id);
    S.modal = null; renderModal(); S.meetingId = null; renderApp(); toast('Meeting deleted');
  },
  async setStatus(d) { const m = mtg(S.meetingId); await save('meetings', {...clone(m), status: d.v}); if (d.v === 'in_progress') S.mode = 'live'; rerender(); },
  async startMeeting() { const m = mtg(S.meetingId); await save('meetings', {...clone(m), status: 'in_progress', start_time: m.start_time || nowTime()}); S.mode = 'live'; rerender(); toast('Meeting started — mark attendance on the right', 'ok'); },
  async endMeeting() {
    const m = mtg(S.meetingId); const pend = S.motions.filter(x => x.meeting_id === m.id && x.result === 'pending' && !/^adjourn$/i.test(x.text || ''));
    if (pend.length && !confirm(`${pend.length} motion(s) still say “Pending”. End the meeting anyway?`)) return;
    const adj = S.motions.find(x => x.meeting_id === m.id && /^adjourn$/i.test(x.text || '')); if (adj && adj.result === 'pending') await save('motions', {...clone(adj), result: 'approved', vote: adj.vote || 'Unanimous'});
    await save('meetings', {...clone(m), status: 'minutes_draft', end_time: m.end_time || nowTime()}); S.mode = 'doc-minutes'; rerender();
    toast('Draft minutes ready. They’ll be approved at the next meeting.', 'ok');
  },
  print() { const m = mtg(S.meetingId); if (m && !m.imported && !S.mode.startsWith('doc')) { S.mode = ['minutes_draft','approved','in_progress'].includes(m.status) ? 'doc-minutes' : 'doc-agenda'; rerender(); } setTimeout(() => window.print(), 80); },
  async togglePublished() { const m = mtg(S.meetingId); await save('meetings', {...clone(m), published: !m.published}); rerender(); },
  async toggleConfidential() { const m = mtg(S.meetingId); await save('meetings', {...clone(m), confidential: !m.confidential, published: m.confidential ? m.published : false}); rerender(); },
  async att(d) {
    const m = mtg(S.meetingId); const a = {present: [], absent: [], ...(m.attendance || {})}; const P = new Set(a.present), A = new Set(a.absent);
    if (d.v === 'p') { if (P.has(d.id)) P.delete(d.id); else { P.add(d.id); A.delete(d.id); } } else { if (A.has(d.id)) A.delete(d.id); else { A.add(d.id); P.delete(d.id); } }
    await save('meetings', {...clone(m), attendance: {...a, present: [...P], absent: [...A]}}); rerender();
  },
  async addItem(d) {
    const m = mtg(S.meetingId); if (d.sec === 'dept') { const used = new Set(itemsOf(m.id).map(i => i.department_id)); const free = S.departments.filter(x => !used.has(x.id));
      const it = {id: uid(), meeting_id: m.id, section: 'dept', sort: sortInSection(m.id, 'dept'), title: free[0] ? free[0].name : 'Department', department_id: free[0] ? free[0].id : null, presenter: free[0] ? free[0].leader : '', updates: []}; await save('items', it); rerender(); return; }
    const it = {id: uid(), meeting_id: m.id, section: d.sec, sort: sortInSection(m.id, d.sec), title: '', updates: [], source: 'manual'};
    await save('items', it); rerender(); setTimeout(() => { const el = document.querySelector(`#it-${it.id} input.tin`); if (el) { el.focus(); el.placeholder = 'Item title'; } }, 30);
  },
  async moveItem(d) {
    const it = item(d.id); const sib = itemsOf(it.meeting_id).filter(i => i.section === it.section); const k = sib.findIndex(i => i.id === it.id); const j = k + (+d.d);
    if (j < 0 || j >= sib.length) return; const o = sib[j]; const a = it.sort || 0, b2 = o.sort || 0;
    await save('items', {...clone(it), sort: b2 === a ? b2 + (+d.d) : b2}); await save('items', {...clone(o), sort: a}); rerender();
  },
  itemMenu(d) { S.modal = {type:'itemMenu', id: d.id}; renderModal(); },
  async saveItemMenu() {
    const it = item(S.modal.id); const patch = {section: $('#im_sec').value, presenter: $('#im_pres').value.trim(), confidential: $('#im_conf').checked};
    if (patch.section !== it.section) patch.sort = sortInSection(it.meeting_id, patch.section);

    await save('items', {...clone(it), ...patch}); if (patch.thread_id) await syncThreadLog(item(it.id)); S.modal = null; renderModal(); rerender();

  async delItem() {

    if (it.thread_id) { const t = thr(it.thread_id); if (t) await save('threads', {...clone(t), log: (t.log || []).filter(e => e.meeting_id !== it.meeting_id)}); }

  async addUpdate(d) {

    await save('items', {...clone(it), updates: [...(it.updates || []), {text, by: me(), at: nowIso()}]}); rerender(); setTimeout(() => { const n = $('#up-' + d.id); n && n.focus(); }, 20);
  },
  async delUpdate(d) { const it = item(d.id); const u = (it.updates || []).slice(); u.splice(+d.k, 1); await save('items', {...clone(it), updates: u}); rerender(); },
  async addMotion(d) { const it = item(d.id); await save('motions', {id: uid(), meeting_id: it.meeting_id, item_id: it.id, sort: motionsOf(it.meeting_id, it.id).length, text: '', result: 'pending'}); rerender(); },

/* ---------------- field binding: data-bind="kind:id:field" saves on change ---------------- */
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.upload !== undefined) {
    const files = [...el.files]; if (!files.length) return; const m = mtg(S.meetingId); const iid = el.dataset.upload || null;
    toast(`Uploading ${files.length} file${files.length === 1 ? '' : 's'}…`);
    for (const f of files) {
      if (f.size > 25 * 1024 * 1024) { toast(`${f.name} is over 25 MB`, 'bad'); continue; }
      try { const safe = f.name.replace(/[^\w.\- ]+/g, '_'); const up = await B.upload(f, `meetings/${m.id}/${uid().slice(0, 8)}-${safe}`);
        await save('docs', {id: uid(), meeting_id: m.id, item_id: iid, name: f.name, path: up.path, size: f.size, mime: f.type, public: false, uploaded_by: me()}); }
      catch (err) { toast('Upload failed: ' + (err.message || err), 'bad'); }
    }
    rerender(); return;
  }
  if (el.dataset.chg === 'nmBody') { S.modalBody = el.value; renderModal(); return; }
  if (el.dataset.chg === 'yearF') { S.yearF = el.value; renderApp(); return; }
  const bind = el.dataset.bind; if (!bind) return;
  const [kind, id, field] = bind.split(':'); const row = S[kind].find(r => r.id === id); if (!row) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (v === '__other') { const n = prompt('Name:'); if (!n) { rerender(); return; } v = n.trim(); }
  if (kind === 'motions' && field === 'vote' && v === '__count') {
    const c = prompt('Votes as yes / no / abstain — e.g. 7/1/0'); if (!c) { rerender(); return; } const [y, n, a] = c.split(/[\/, ]+/).map(x => parseInt(x, 10) || 0);
    await save('motions', {...clone(row), yes: y, no: n, abstain: a, vote: `${y} yes, ${n} no${a ? ', ' + a + ' abstain' : ''}`}); rerender(); return;
  }
  const next = clone(row); if (field.includes('.')) { const [a, b2] = field.split('.'); next[a] = {...(next[a] || {}), [b2]: v}; } else next[field] = typeof v === 'string' ? v.trim() : v;
  if (field === 'due_date' && !v) next[field] = null;
  const prevResult = row.result;
  await save(kind, next);
  if (kind === 'items' && field === 'minutes' && next.thread_id) await syncThreadLog(next);
  if (kind === 'motions' && field === 'result') { await applyMotionEffects(next, prevResult); rerender(); }
  if (kind === 'motions' && field === 'moved_by' && v && !mem(v) && el.value === '__other') rerender();
});

async function boot() {
  B = S.backend === 'local' ? Local : Remote;
  if (B === Remote) { try { Remote.init(); } catch (e) { $('#app').innerHTML = viewLogin('Could not connect to the database.'); return; } }
  renderApp(); await reload(); loadHubUsers(); B.subscribe(remoteChanged); checkEmail().then(() => { if (S.view === 'settings') renderApp(); });
  const deep = PARAMS.get('m'); if (deep && mtg(deep)) { history.replaceState(null, '', location.pathname); ACT.openMeeting({id: deep}); }
}
function signIn(session, fallbackUser) { S.backend = 'remote'; lsSet('board_backend', 'remote'); S.email = (session && session.email) || ''; S.hubAdmin = !!(session && session.isAdmin); S.user = session ? session.username : fallbackUser; S.userName = session ? (session.displayName || session.username) : fallbackUser; lsSet('board_user', S.user); }
function hubSession() { if (!window.DelcAuth) return null; try { const s = DelcAuth.getSession(); return s && DelcAuth.hasAppAccess(s, CONFIG.appKey) ? s : null; } catch (_) { return null; } }
async function start() {
  if (PARAMS.get('demo') === '1') lsSet('board_backend', 'local');
  const backend = lsGet('board_backend') || 'remote';
  if (PUBLIC) { S.backend = backend; B = backend === 'local' ? Local : Remote; if (B === Remote) { try { Remote.init(); } catch (e) {} } renderApp(); await reload(); return; }
  if (backend === 'local') { S.backend = 'local'; S.user = lsGet('board_user'); S.userName = S.user === 'demo' ? 'Demo' : S.user; if (S.user) boot(); else renderApp(); return; }
  let sess = hubSession();
  if (sess && DelcAuth.refreshSession) { try { await DelcAuth.refreshSession(); sess = hubSession(); } catch (_) {} }
  if (sess && window.supabase) { signIn(sess); boot(); return; }
  const s0 = window.DelcAuth && (() => { try { return DelcAuth.getSession(); } catch (_) { return null; } })();
  $('#app').innerHTML = viewLogin(s0 ? `You’re signed in to the hub as ${s0.username}, but your account doesn’t have access to delcBOARD. Ask an admin to turn it on, or sign in as someone else.` : '');
}


/* ================= Roles & department updates ================= */
var ROLES = {
  admin:    {name: 'Admin', short: 'Admin', desc: 'everything, plus reviews department updates and manages people & groups'},
  member:   {name: 'Council member', short: 'Council', desc: 'meetings, agendas, minutes and records; sends updates for any department they direct'},
  director: {name: 'Department director', short: 'Director', desc: 'only sees their own department page: sends updates and sees what was approved'}
};
var UPD = {pending: {name: 'Waiting for review', cls: 'warn'}, returned: {name: 'Sent back', cls: 'bad'}, approved: {name: 'Approved', cls: 'ok'}, declined: {name: 'Not used', cls: 'gray'}, draft: {name: 'Draft', cls: 'gray'}};

function myMember() {
  const u = String(S.user || '').toLowerCase(), e = String(S.email || '').toLowerCase();
  if (S.backend === 'local') return S.demoRole === 'director' ? mem('m-barb') || S.members[0] : mem('m-derek') || S.members[0];
  return S.members.find(m => m.active !== false && ((m.hub_username && m.hub_username.toLowerCase() === u) || (e && m.email && m.email.toLowerCase() === e))) || null;
}
function role() {
  if (S.backend === 'local') return S.demoRole || 'admin';
  if (!S.loaded) return 'member';
  const m = myMember(); if (m) return ROLES[m.role] ? m.role : 'member';
  // first-time setup: if nobody is an Admin yet, a hub admin can get in to set things up
  if (S.hubAdmin && !S.members.some(x => x.role === 'admin' && x.active !== false)) return 'admin';
  return 'none';
}
function isAdmin() { return role() === 'admin'; }
function myDepts() {
  const all = S.departments.filter(d => d.active !== false).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  if (isAdmin()) return all;
  const me_ = myMember(); return me_ ? all.filter(d => (d.director_ids || []).includes(me_.id)) : [];
}
function canSendFor(d) { const me_ = myMember(); return isAdmin() || !!(me_ && (d.director_ids || []).includes(me_.id)); }
function deptBadge() {
  if (canReview()) return S.updates.filter(u => u.status === 'pending').length;
  const ids = new Set(myDepts().map(d => d.id)); return S.updates.filter(u => ids.has(u.department_id) && u.status === 'returned').length;
}
const updLines = u => ulines(u.text).map(t => ({text: t, by: u.submitted_by || '', at: nowIso(), update_id: u.id}));
const waitingUpdates = did => S.updates.filter(u => u.department_id === did && u.status === 'approved' && !u.meeting_id);
const openCouncilMeetings = () => S.meetings.filter(m => m.body_id === 'council' && ['draft','ready','in_progress'].includes(m.status)).sort((a, b) => String(a.meeting_date).localeCompare(String(b.meeting_date)));
const updChip = s => `<span class="chip ${(UPD[s] || {}).cls || ''}">${esc((UPD[s] || {name: s}).name)}</span>`;
function meetingPick(id, sel) {
  const ms = openCouncilMeetings(); const v = sel === undefined ? (ms[0] ? ms[0].id : '') : (sel || '');
  return `<select id="${id}" class="inp">${ms.map(m => `<option value="${m.id}" ${m.id === v ? 'selected' : ''}>${esc(m.title)}</option>`).join('')}<option value="" ${!v ? 'selected' : ''}>Next council meeting (when it’s created)</option></select>`;
}
async function loadHubUsers() {
  if (S.backend !== 'remote' || !B.sb) return;
  try { const r = await B.sb.from('hub_users').select('username,display_name').order('display_name'); if (r.data) S.hubUsers = r.data; } catch (_) {}
}

  return it.id;
}

function calendarView(onlyDid) {
  const showAll = S.calF === 'all'; const mineIds = new Set(myDepts().map(d => d.id));
  const rows = [];
  S.projects.filter(p => p.status !== 'cancelled' && (showAll || p.department_id === (S.calF === 'mine' ? (onlyDid || p.department_id) : S.calF) || (S.calF === 'mine' && mineIds.has(p.department_id)))).forEach(p => {
    if (p.start_date) rows.push({date: p.start_date, end: p.end_date, p, kind: p.kind === 'event' ? 'event' : 'start'});
    visTasks(p).filter(x => x.due && !x.done && (mineIds.has(p.department_id) || isAdmin())).forEach(x => rows.push({date: x.due, p, kind: 'task', text: x.text, who: x.who}));
  });
  S.meetings.filter(m => isUpcoming(m)).forEach(m => rows.push({date: m.meeting_date, kind: 'meeting', m}));

/* ---- motions on the agenda for approval requests ---- */
async function addProjectMotions(u, itemId, meetingId) {
  if (!itemId || !meetingId) return;
  for (const pid of (u.project_ids || [])) {
    const p = proj(pid); if (!p || p.approval_status !== 'requested' || !p.approval_ask) continue;
    if (S.motions.some(mo => mo.meeting_id === meetingId && mo.project_id === pid)) continue;
    await save('motions', {id: uid(), meeting_id: meetingId, item_id: itemId, sort: motionsOf(meetingId, itemId).length, text: `Approve: ${p.approval_ask} (${p.title})`, result: 'pending', project_id: pid});
    await save('projects', {...clone(p), approval_status: 'on_agenda', approval_meeting_id: meetingId, updated_at: nowIso()});
  }
}
const _placeUpdate = placeUpdate;
placeUpdate = async function (u, mid) { const iid = await _placeUpdate(u, mid); if (iid) await addProjectMotions(u, iid, mid); return iid; };
const _createMeeting = createMeeting;
createMeeting = async function (o) {
  const m = await _createMeeting(o);
  for (const u of S.updates.filter(x => x.meeting_id === m.id && x.item_id)) await addProjectMotions(u, u.item_id, m.id);
  return m;
};
const _applyMotionEffects = applyMotionEffects;

  await _applyMotionEffects(mo, prev);

  if (p.approval_status !== st) { await save('projects', {...clone(p), approval_status: st, approval_vote: mo.vote || null, notes: [...(p.notes || []), {at: nowIso(), by: me(), text: st === 'approved' ? `Council approved: ${p.approval_ask}` : st === 'declined' ? `Council did not approve: ${p.approval_ask}` : 'Council vote reset', auto: true}], updated_at: nowIso()}); if (st !== 'on_agenda') toast(`${p.title}: ${PAPPR[st].toLowerCase()}`, 'ok'); }
};

async function shrinkImage(file, max) {
  max = max || 1600;
  if (!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type || '') && !/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '')) return file;

    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82)); if (!blob) return file;
    return new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', {type: 'image/jpeg'});
  } catch (_) { return file; }
}

  return out;
}

/* ---------- roles: event coordinator ---------- */
function canCoordinate() { if (isAdmin()) return true; const m = myMember(); return !!(m && m.coordinator); }
function myName() { const m = myMember(); return (m && m.name) || S.userName || ''; }
const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
const memByName = n => S.members.find(m => m.active !== false && sameName(m.name, n));
const peopleList = () => S.members.filter(x => x.active !== false).map(x => x.name).sort((a, b) => a.localeCompare(b));
const directorNames = did => ((dept(did) || {}).director_ids || []).map(id => (mem(id) || {}).name).filter(Boolean);
const addDays = (iso, n) => { const d = dOf(iso); d.setDate(d.getDate() + n); return isoOf(d); };
const daysTo = iso => Math.round((dOf(iso) - dOf(today())) / 864e5);
const pDepts = p => [p.department_id, ...(p.support_dept_ids || [])].filter(Boolean);
const involved = p => { const own = ownDepts(); const mine = new Set((own.length ? own : myDepts()).map(d => d.id)); return pDepts(p).some(id => mine.has(id)); };
function ownDepts() { const m = myMember(); return m ? S.departments.filter(d => d.active !== false && (d.director_ids || []).includes(m.id)) : []; }
function calScopeNow() { if (S.calScope == null) S.calScope = ownDepts().length ? 'mine' : 'all'; return S.calScope; }
function isMyTask(t, p) { const m = myMember(); if (m && t.who_id === m.id) return true; if (t.who && sameName(t.who, myName())) return true; return false; }

/* a director of a supporting department can also work the event (tick tasks, add notes) */
const _canSendFor8 = canSendFor;
canSendFor = function (d) {
  if (_canSendFor8(d)) return true;
  const p = S._pjCtx; if (p && d && d.id === p.department_id) { if (canCoordinate()) return true; const m = myMember(); if (m && (p.support_dept_ids || []).some(id => ((dept(id) || {}).director_ids || []).includes(m.id))) return true; }
  return false;
};
const _myDepts8 = myDepts;

/* ---------- header: F&B-style top bar + hero + tabs ---------- */

const udot = due => `<span class="udot ${urg(due)}" title="${!due ? 'No due date' : urg(due) === 'r' ? 'Due within 24 hours or overdue' : urg(due) === 'y' ? 'Due within 3 days' : 'Upcoming'}"></span>`;
function dueChip(due) { if (!due) return '<span class="due">No date</span>'; const n = daysTo(due); const l = n < 0 ? `${-n} day${n === -1 ? '' : 's'} late` : n === 0 ? 'Due today' : n === 1 ? 'Tomorrow' : fmtD(due, {month: 'short', day: 'numeric'}); return `<span class="due ${n <= 1 ? 'late' : n <= 3 ? 'soon' : ''}">${esc(l)}</span>`; }

function fbGhosts() { const linked = new Set(S.projects.map(x => String(x.fb_event_id || '')).filter(Boolean)); return (S.fb || []).filter(e => !linked.has(String(e.id))); }

/* ---------- Calendar ---------- */
function viewCal() {
  const sub = `<div class="sub-tab-bar">${[['month','Month'],['list','List']].map(([k, l]) => `<button class="sub-tab ${S.calMode === k ? 'on' : ''}" data-act="calMode" data-v="${k}">${l}</button>`).join('')}</div>`;
  const scopeSeg = `<div class="seg">${ownDepts().length ? `<button class="${calScopeNow() === 'mine' ? 'on' : ''}" data-act="calScope" data-v="mine">Mine</button>` : ''}<button class="${calScopeNow() !== 'mine' ? 'on' : ''}" data-act="calScope" data-v="all">Whole church</button></div>`;
  if (S.calMode === 'list') {
    const from = today(); const its = calItems(from, addDays(from, 365), calScopeNow()).filter(it => it.kind !== 'event' && it.kind !== 'project' || it.first);
    const months = {}; its.forEach(it => { const k = String(it.date).slice(0, 7); (months[k] = months[k] || []).push(it); });
    return `<div class="page">${sub}<div class="row between" style="margin-bottom:10px">${scopeSeg}${canCoordinate() ? '<button class="btn gold" data-act="newEvent">📅 + New event</button>' : ''}</div>
      ${Object.keys(months).map(k => `<div class="hsec">${esc(monthName(k + '-01'))}</div>${months[k].map(calLine).join('')}`).join('') || '<div class="card empty">Nothing coming up.</div>'}</div>`;
  }
  const [yy, mm] = S.calMonth.split('-').map(Number); const first = new Date(yy, mm - 1, 1); const start = new Date(first); start.setDate(1 - first.getDay());
  const days = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); days.push(isoOf(d)); }
  if (days.slice(35).every(d => d.slice(0, 7) !== S.calMonth)) days.length = 35;
  const its = calItems(days[0], days[days.length - 1], calScopeNow()); const by = {}; its.forEach(it => (by[it.date] = by[it.date] || []).push(it));
  const t0 = today(); const sel = S.calDay && S.calDay.slice(0, 7) === S.calMonth ? S.calDay : null;
  const cell = d => { const L = by[d] || []; const show = L.slice(0, 3);
    return `<div class="mcell ${d.slice(0, 7) !== S.calMonth ? 'out' : ''} ${d === t0 ? 'today' : ''} ${d === sel ? 'sel' : ''}" data-act="calPick" data-v="${d}"><div class="dn">${+d.slice(8)}</div>
      ${show.map(it => `<span class="ev ${it.kind === 'task' ? 'task' : it.kind === 'meeting' ? 'mtg' : it.kind === 'fb' ? 'fb' : ''}" ${it.kind === 'task' || it.kind === 'meeting' || it.kind === 'fb' ? '' : `style="background:${it.color}"`} title="${esc(it.title)}" ${itemAct(it)}>${it.kind === 'task' ? udot(it.t.due) : it.kind === 'meeting' ? '🏛️ ' : it.kind === 'fb' ? '🍽️ ' : it.kind === 'edu' ? '🎒 ' : ''}${esc(it.title)}</span>`).join('')}${L.length > 3 ? `<div class="more">+${L.length - 3} more</div>` : ''}</div>`; };
  const dayList = sel ? (by[sel] || []) : its.filter(it => it.date.slice(0, 7) === S.calMonth && (it.kind !== 'event' && it.kind !== 'project' || it.first || it.date === days.find(x => x.slice(0, 7) === S.calMonth)));
  return `<div class="page">${sub}
    <div class="mcal-head"><button class="btn sm" data-act="calNav" data-v="-1">‹</button><h3>${esc(first.toLocaleDateString('en-US', {month: 'long', year: 'numeric'}))}</h3><button class="btn sm" data-act="calNav" data-v="1">›</button><button class="btn sm ghost" data-act="calNav" data-v="0">Today</button><span class="spacer"></span>${scopeSeg}${canCoordinate() ? '<button class="btn gold" data-act="newEvent">📅 + New event</button>' : ''}</div>
    <div class="mcal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w => `<div class="dow">${w}</div>`).join('')}${days.map(cell).join('')}</div>
    <div class="legend"><span><span class="dot" style="background:var(--navy)"></span> Event (colored by lead department)</span><span><span class="udot g"></span>Task upcoming</span><span><span class="udot y"></span>due in 3 days</span><span><span class="udot r"></span>due within 24 hrs / overdue</span><span>🏛️ Meeting</span><span>🍽️ F&amp;B event</span></div>
    <div class="hsec">${sel ? esc(fmtD(sel, {weekday: 'long', month: 'long', day: 'numeric'})) : 'This month'}${sel ? ` <button class="btn xs ghost" data-act="calPick" data-v="">Show whole month</button>` : ''}</div>
    ${sel && canCoordinate() ? `<button class="btn sm gold" data-act="newEvent" data-date="${sel}" style="margin-bottom:8px">+ Event on this day</button>` : ''}

function calLine(it) {

  const sup = (it.p.support_dept_ids || []).map(id => (dept(id) || {}).name).filter(Boolean);
  return `<div class="calrow" ${itemAct(it)} style="border-left:4px solid ${it.color}">${day}<div class="main"><b>${pIcon(it.p)} ${esc(it.p.title)}</b> ${it.p.event_type ? `<span class="type-pill" style="margin:0">${esc(it.p.event_type)}</span>` : ''}<div class="tiny muted">${esc(d.name || '')}${sup.length ? ' + ' + esc(sup.join(', ')) : ''}${it.p.start_time ? ' · ' + esc(it.p.start_time) : ''}${it.p.location ? ' · ' + esc(it.p.location) : ''}${fbOf(it.p) ? ' · 🍽️ F&amp;B' : ''}</div></div>${pChip(it.p.status)}</div>`;

/* ---- 2-digit years: typing 26 means 2026 ---- */
function fixYear(el) { if (!el || el.type !== 'date' || !el.value) return; const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(el.value); if (m && +m[1] < 100) el.value = `${2000 + +m[1]}-${m[2]}-${m[3]}`; else if (m && +m[1] < 1000) el.value = `20${m[1].slice(-2)}-${m[2]}-${m[3]}`; }
['change', 'focusout'].forEach(ev => document.addEventListener(ev, e => fixYear(e.target), true));

document.addEventListener('change', async e => { const k = e.target.dataset && e.target.dataset.bl; if (!k) return; const d = dept(e.target.dataset.d); if (!d) return; const L = clone(d.budget_lines || []); const x = L[+e.target.dataset.i]; if (!x) return; x[k] = k === 'amount' ? (parseFloat(e.target.value) || 0) : e.target.value.trim(); await save('departments', {...clone(d), budget_lines: L}); });

  async blAdd(d) { const dp = dept(d.d); await save('departments', {...clone(dp), budget_lines: [...(dp.budget_lines || []), {name: '', amount: 0}]}); rerender(); setTimeout(() => { const L = $$(`[data-bl="name"][data-d="${d.d}"]`); L.length && L[L.length - 1].focus(); }, 30); },

/* older minutes came out of PDFs as run-on lines: "I. INTRO a. Call to order b. ... i. ... 1. ... a) ..." — break them back into an outline */
function explodeOutline(L) {
  const ROM = /^(?:i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii)$/;
  const out = [];
  L.forEach(line => {
    const marks = (line.match(/(?:^|\s)(?:[IVX]{1,4}|[a-z]|[ivx]{1,4}|\d{1,2})[.)](?=\s|$)/g) || []).length;
    if (line.length < 50 || marks < 2) { out.push(line); return; }
    const parts = line.split(/\s(?=(?:[IVX]{1,4}|[a-z]|[ivx]{1,4}|\d{1,2})[.)](?:\s|$))/);
    let lastLetter = '';
    parts.forEach(seg => {
      seg = seg.trim(); if (!seg) return; const m = /^((?:[IVX]{1,4})|(?:[a-z]{1,4})|(?:\d{1,2}))([.)])\s*(.*)$/.exec(seg);
      if (!m) { out.push(seg); return; }
      const [, k, p, rest] = m; if (!rest) return;
      if (/^[IVX]+$/.test(k) && p === '.') { out.push(rest); return; }
      if (p === '.' && /^[a-z]$/.test(k) && !(ROM.test(k) && lastLetter !== String.fromCharCode(k.charCodeAt(0) - 1))) { lastLetter = k; out.push(rest); return; }
      if (p === '.' && ROM.test(k)) { out.push(' • ' + rest); return; }
      if (p === '.' && /^\d/.test(k)) { out.push('    • ' + rest); return; }
      if (p === ')' && ROM.test(k) && k !== 'c' && k !== 'd') { out.push('      • ' + rest); return; }
      out.push('    • ' + rest);
    });
  });

  const res = [];
  out.forEach(t => { const m = /^([A-Z][A-Z&'’ ]{4,40}?)\s+([A-Z][a-z].*)$/.exec(t); if (m && !/[a-z]/.test(m[1]) && /\s/.test(m[1].trim()) ) { res.push(m[1].trim()); res.push(m[2]); } else res.push(t.replace(/\s+[IVX]{1,4}\.$/, '')); });
  return res;
}

    if (bul) { const sub = /^o\s/.test(t) && ind > 0; out += `<div class="mb l${sub ? Math.max(2, lvl) : Math.max(1, lvl)}">${lab(bul[1])}</div>`; continue; }

    if (ind === 0) {

      const m = /^(.+?)\s+–\s+(.*)$/.exec(t);

      const L = $$('.tp_short'); if (L.length) { const el = L[L.length - 1]; el.focus(); el.scrollIntoView({block: 'center'}); } },
    tl32Move(d) { const t = tplGrab(); const i = +d.i, s = secOf(t.tasks[i].when); let j = i + (+d.v); while (j >= 0 && j < t.tasks.length && secOf(t.tasks[j].when) !== s) j += (+d.v); if (j < 0 || j >= t.tasks.length) return; const a = t.tasks; [a[i], a[j]] = [a[j], a[i]]; neRefresh(); },
    async tplSave() {
      const md = S.modal; if (!md || !md.row || md.row.id !== 'tpl-library') return _tplSave32();
      const t = tplGrab(); const bad = (t.tasks || []).find(x => !x.text && x.short); if (bad) { toast('Each task needs its wording (the Task box)', 'bad'); return; }
      const before = new Set(LIB().map(x => x.key));
      $$('.tp_short').forEach(el => { if (!el.value.trim()) { const tx = $(`.tp_text[data-i="${el.dataset.i}"]`); const v = tx ? tx.value.trim() : ''; el.value = v.length > 16 ? v.slice(0, 15).trim() + '…' : v; } });
      const fresh = (t.tasks || []).filter(x => x.text && !before.has(x.key));
      await _tplSave32();
      for (const r of S.templates.filter(x => x.id !== 'tpl-library' && x.flags)) {
        const f = r.flags; let ch = false; const nf = {...f};
        fresh.forEach(x => { const s = secOf(x.when); const k = s === 'admin' ? 'admin' : s === 'mkt' ? 'mkt' : null; if (k && Array.isArray(nf[k]) && !nf[k].includes(x.key)) { nf[k] = [...nf[k], x.key]; ch = true; } });
        if (ch) await save('templates', {...clone(r), flags: nf});
      }
      if (fresh.length) rerender();
    }
  });

  /* Task templates page: make the editor easy to find */
  const _viewTemplates32 = viewTemplates;
  viewTemplates = function () {
    const L = LIB(); const A = L.filter(x => secOf(x.when) === 'admin').length, M = L.filter(x => secOf(x.when) === 'mkt').length, O = L.length - A - M;
    return _viewTemplates32().replace(/<div class="card" data-act="tplOpen" data-id="tpl-library"[\s\S]*?<\/div><\/div>/, `<div class="card tl32-card" data-act="tplOpen" data-id="tpl-library" style="cursor:pointer"><div class="row between"><div><b>Church Admin &amp; Marketing tasks</b><div class="tiny muted" style="margin-top:3px">Rename a task, change who does it or when it’s due, add new ones or remove old ones.</div></div><button class="btn pri sm">✏️ Edit tasks</button></div>
      <div class="tiny muted" style="margin-top:6px">🏢 Church Admin ${A} · 📣 Marketing ${M}${O ? ' · 📋 Other ' + O : ''}</div></div>`);
  };
})();


/* ================= p33: delcEDUCATION weeknight classes (e.g. JAM) on the church calendar ================= */
var EDU_CLASSES = []; var EDU_SKIP = new Set();
const EDU_URL = 'https://delcdata.github.io/delcEDUCATION/';
const eduWeeknight = r => !!(r && r.meets && (r.meets.mode === 'dates' || (+r.meets.day || 0) !== 0));
function eduMeetDates(r, from, to) {
  const m = r.meets || {}; if (m.mode === 'dates') return (m.dates || []).filter(d => d >= from && d <= to).sort();
  const out = []; const wd = +m.day || 0;
  for (let d = from; d <= to; d = addDays(d, 1)) { const x = dOf(d); if (x.getDay() !== wd) continue; const nth = Math.floor((x.getDate() - 1) / 7) + 1; if (m.mode === 'nth' && (m.weeks || []).length && !m.weeks.includes(nth)) continue; out.push(d); }
  return out;
}
async function loadEduClasses() {
  if (S.backend === 'local') { EDU_CLASSES = [{id: 'jam', name: 'JAM', ages: 'K – 6th grade', place: 'JAM Room', meets: {mode: 'nth', day: 3, weeks: [2, 4], time: '6:30 PM'}}]; return; }
  try {
    const r = await B.sb.from('edu_records').select('kind,data').in('kind', ['rooms', 'schedule']);
    if (r.error) throw r.error; const L = r.data || [];
    EDU_CLASSES = L.filter(x => x.kind === 'rooms').map(x => x.data).filter(eduWeeknight);
    EDU_SKIP = new Set(L.filter(x => x.kind === 'schedule' && x.data && x.data.cancelled).map(x => x.data.room_id + '|' + x.data.date));
  } catch (e) { console.warn('edu classes', e); }
}
const _reload33 = reload; reload = async function () { await loadEduClasses(); return _reload33(); };
const eduDeptId = () => EDU_DEPT;

const _calendarView33 = calendarView;
calendarView = function (onlyDid) {
  const did = eduDeptId();
  if (!EDU_CLASSES.length || !(S.calF === 'all' || onlyDid === did || S.calF === did)) return _calendarView33(onlyDid);
  if (onlyDid && onlyDid !== did) return _calendarView33(onlyDid);
  const from = addDays(today(), -62), to = addDays(today(), 200); const ghosts = [];
  EDU_CLASSES.forEach(c => eduMeetDates(c, from, to).filter(dt => !EDU_SKIP.has(c.id + '|' + dt)).forEach(dt => ghosts.push({id: 'edu-' + c.id + '-' + dt, department_id: did, kind: 'event', title: c.name, status: 'educlass', start_date: dt, start_time: (c.meets && c.meets.time) || '', end_time: null, location: c.place || '', tasks: [], _edu: c})));
  if (!ghosts.length) return _calendarView33(onlyDid);
  const keep = S.projects; S.projects = S.projects.concat(ghosts);
  let html; try { html = _calendarView33(onlyDid); } finally { S.projects = keep; }
  ghosts.forEach(g => { html = html.split(`data-act="openProj" data-id="${g.id}"`).join(`data-act="eduClassOpen" data-id="${esc(g._edu.id)}" data-d="${g.start_date}"`).split(`<b>📅 ${esc(g.title)}</b>`).join(`<b>🎒 ${esc(g.title)}</b>`); });
  return html.split('<span class="chip ">educlass</span>').join('<span class="chip gray">delcEDUCATION class</span>');
};
ACT.eduClassOpen = function (d) {
  const c = EDU_CLASSES.find(x => x.id === d.id); if (!c) return;
  const m = c.meets || {}; const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const when = m.mode === 'dates' ? 'On set dates' : m.mode === 'nth' && (m.weeks || []).length ? m.weeks.map(n => ['1st', '2nd', '3rd', '4th', '5th'][n - 1]).join(' & ') + ' ' + days[+m.day || 0] + ' of the month' : 'Every ' + days[+m.day || 0];
  S.modal = {type: 'eduClass', html: `<div class="mhead"><h2>🎒 ${esc(c.name)}</h2><button class="x" data-act="closeModal">×</button></div>
    <div class="stack"><div><b>${fmtD(d.d)}</b>${m.time ? ' · ' + esc(m.time) : ''}</div>
    <div class="small">${esc(when)}${c.place ? ' · 📍 ' + esc(c.place) : ''}${c.ages ? ' · ' + esc(c.ages) : ''}</div>
    <div class="tiny muted">This class is scheduled in delcEDUCATION. Change its dates, teachers or class list there and the calendar follows.</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Close</button><a class="btn pri" href="${EDU_URL}" target="_blank" rel="noopener">Open delcEDUCATION</a></div></div>`};
  renderModal();
};
const _renderModal33 = renderModal;
renderModal = function () { const md = S.modal; if (!md || md.type !== 'eduClass') return _renderModal33(); $('#modal').innerHTML = `<div class="modal-bg" data-act="bgClose"><div class="modal" role="dialog" style="max-width:520px">${md.html}</div></div>`; };
/* month / list calendar items (calItems calls this) */
function eduCalItems(from, to, scope) {
  if (scope === 'mine' && !ownDepts().some(d => d.id === EDU_DEPT)) return [];
  const out = []; EDU_CLASSES.forEach(c => eduMeetDates(c, from, to).filter(dt => !EDU_SKIP.has(c.id + '|' + dt)).forEach(dt => out.push({date: dt, kind: 'edu', c, title: c.name, color: c.color || deptColor(EDU_DEPT)})));
  return out;
}

start();
